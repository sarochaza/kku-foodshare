name: Verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: foodshare
          POSTGRES_USER: foodshare
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodshare -d foodshare"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: code/pom.xml
      - name: Unit and H2 integration tests
        working-directory: code
        run: ./mvnw -B verify
      - name: PostgreSQL migration, validation, stock and concurrency integration
        working-directory: code
        run: >-
          ./mvnw -B -Dtest=FoodJourneyTest,ReviewRegressionTest,WebPagesTest
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/foodshare
          -Dspring.datasource.username=foodshare
          -Dspring.datasource.password=ci-test-only
          -Dspring.flyway.enabled=true
          -Dspring.jpa.hibernate.ddl-auto=validate test
      - name: Build deployment container
        run: docker build -t foodshare:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: code/target/surefire-reports
