# Optional local inbox for demonstrations. Does not send to real email accounts.
# docker compose -p kku-foodshare-phase1 -f compose.yaml -f compose.mail-test.yaml up --build -d
services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
  app:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      MAIL_ENABLED: "true"
      MAIL_PROVIDER: smtp
      MAIL_FROM: no-reply@foodshare.test
      APP_BASE_URL: "http://127.0.0.1:${APP_PORT:-8080}"
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: "5000"
