<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>สมัครสมาชิก | KKU FoodShare</title>

    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>

<main class="register-page">

    <section class="register-container">

        <!-- =========================
             LEFT PANEL
        ========================== -->

        <div class="register-intro">

            <a th:href="@{/}" class="brand">
                <img
                    th:src="@{/images/foodshare-logo.png}"
                    alt="KKU FoodShare">
            </a>

            <div class="intro-text">

                <h1>
                    มาแบ่งปัน
                    <span>สิ่งดี ๆ ไปด้วยกัน</span>
                </h1>

                <p>
                    เพราะทุกมื้ออาหาร<br>
                    สร้างการเปลี่ยนแปลงได้ 🌱
                </p>

            </div>

            <img
                th:src="@{/images/register-mascot.png}"
                alt="KKU FoodShare Mascot"
                class="register-mascot">

        </div>


        <!-- =========================
             RIGHT PANEL
        ========================== -->

        <div class="register-form-panel">

            <div class="form-header">

                <span class="small-title">
                    CREATE ACCOUNT
                </span>

                <h2>
                    สมัครสมาชิก
                </h2>

            </div>


            <!-- GENERAL ERROR -->

            <div
                class="alert-error"
                th:if="${error}">

                <span th:text="${error}"></span>

            </div>


            <!-- FORM -->

            <form
                th:action="@{/register}"
                th:object="${registerRequest}"
                method="post"
                class="register-form">


                <!-- DISPLAY NAME -->

                <div class="form-group">

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ♙
                        </span>

                        <input
                            type="text"
                            th:field="*{displayName}"
                            placeholder="ชื่อที่แสดง"
                            autocomplete="name"
                            required>

                    </div>

                    <p
                        class="field-error"
                        th:if="${#fields.hasErrors('displayName')}"
                        th:errors="*{displayName}">
                    </p>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            th:field="*{email}"
                            placeholder="อีเมล"
                            autocomplete="email"
                            required>

                    </div>

                    <p
                        class="field-error"
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}">
                    </p>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            id="password"
                            type="password"
                            th:field="*{password}"
                            placeholder="รหัสผ่าน"
                            autocomplete="new-password"
                            required>

                       <button
    type="button"
    class="password-toggle"
    onclick="togglePassword()"
    aria-label="แสดงหรือซ่อนรหัสผ่าน">

    <svg id="eyeOpen"
         xmlns="http://www.w3.org/2000/svg"
         width="22"
         height="22"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>
    </svg>

    <svg id="eyeClosed"
         xmlns="http://www.w3.org/2000/svg"
         width="22"
         height="22"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"
         style="display:none;">

        <path d="M3 3l18 18"/>
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
        <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-2.1 3.2"/>
        <path d="M6.6 6.6C3.8 8.5 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 5.4-1.6"/>
    </svg>

</button>

                    </div>

                    <p
                        class="field-error"
                        th:if="${#fields.hasErrors('password')}"
                        th:errors="*{password}">
                    </p>

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="register-button">

                    สมัครสมาชิก

                    <span>
                        →
                    </span>

                </button>

            </form>


            <!-- DIVIDER -->

            <div class="divider">

                <span></span>

                <p>หรือ</p>

                <span></span>

            </div>


            <!-- GOOGLE -->

            <a
    th:href="@{/oauth2/authorization/google}"
    class="google-button">

    <img
        th:src="@{/images/logo_gg.png}"
        alt="Google"
        class="google-logo">

    <span>
        สมัครด้วย Google
    </span>

</a>


            <!-- LOGIN LINK -->

            <div class="login-link">

                <span>
                    มีบัญชีอยู่แล้ว?
                </span>

                <a th:href="@{/login}">
                    เข้าสู่ระบบ
                </a>

            </div>

        </div>

    </section>

</main>


<script>

  
    function togglePassword() {

        const password = document.getElementById("password");
        const eyeOpen = document.getElementById("eyeOpen");
        const eyeClosed = document.getElementById("eyeClosed");

        if (password.type === "password") {

            password.type = "text";

            eyeOpen.style.display = "none";
            eyeClosed.style.display = "block";

        } else {

            password.type = "password";

            eyeOpen.style.display = "block";
            eyeClosed.style.display = "none";
        }
    }


</script>

</body>

</html>
