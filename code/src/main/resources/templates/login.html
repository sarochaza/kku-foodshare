<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | KKU FoodShare</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<main class="login-page">
    <!-- Animated decoration -->
    <div class="login-atmosphere" aria-hidden="true">

        <span class="login-bubble bubble-one"></span>
        <span class="login-bubble bubble-two"></span>
        <span class="login-bubble bubble-three"></span>

        <span class="login-floating-leaf login-leaf-one">◆</span>
        <span class="login-floating-leaf login-leaf-two">◆</span>
        <span class="login-floating-leaf login-leaf-three">◆</span>

    </div>

    <section class="login-card">

        <!-- Logo -->
        <a th:href="@{/}" class="logo-link">
            <img
                th:src="@{/images/foodshare-logo.png}"
                alt="KKU FoodShare"
                class="login-logo">
        </a>

        <!-- Welcome -->
        <div class="login-header">
            <h1>ยินดีต้อนรับ</h1>

            <p>
                เข้าสู่ระบบเพื่อร่วมแบ่งปันอาหาร<br>
                และสร้างชุมชนที่ยั่งยืนไปด้วยกัน 🌱
            </p>
        </div>

        <!-- Login Error -->
        <div class="alert alert-error" th:if="${param.error}">
            อีเมลหรือรหัสผ่านไม่ถูกต้อง
        </div>

        <!-- Logout Success -->
        <div class="alert alert-success" th:if="${param.logout}">
            ออกจากระบบเรียบร้อยแล้ว
        </div>
        <div
    class="alert alert-success"
    th:if="${param.resetSuccess}">

    ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว
    กรุณาเข้าสู่ระบบ

</div>

        <!-- Login Form -->
        <form
            th:action="@{/login}"
            method="post"
            class="login-form">

            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    อีเมล
                    <span>*</span>
                </label>

                <div class="input-wrapper">

                    <div class="input-icon">✉</div>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="example@kku.ac.th"
                        autocomplete="email"
                        required>

                </div>

            </div>

            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    รหัสผ่าน
                    <span>*</span>
                </label>

                <div class="input-wrapper">

                    <div class="input-icon">🔒</div>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="กรอกรหัสผ่าน"
                        autocomplete="current-password"
                        required>

                </div>

                <div class="forgot-password">

                    <a th:href="@{/forgot-password}">
        ลืมรหัสผ่านเหรอ?
                    </a>

                </div>

            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="login-button">

                เข้าสู่ระบบ

                <span>→</span>

            </button>

        </form>

        <!-- Register -->
        <div class="register-area">

            <span>
                ยังไม่มีบัญชีผู้ใช้ใช่ไหม?
            </span>

            <a th:href="@{/register}">
                สมัครสมาชิก
            </a>

        </div>

    </section>
        <!-- Student Scooter -->
    <div class="login-scooter-scene" aria-hidden="true">

        <div class="scooter-speed-lines">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <img
            class="login-scooter"
            th:src="@{/images/login-student-scooter.png}"
            alt=""
        >

        <div class="scooter-shadow"></div>

    </div>

    <!-- Footer -->
    <footer class="login-footer">

        <strong>KKU FoodShare</strong>

        <span>
            Share Food · Brighter Tomorrow
        </span>

    </footer>

</main>
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const loginPage =
            document.querySelector(".login-page");

        const loginCard =
            document.querySelector(".login-card");

        const reduceMotion =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

        if (
            !loginPage ||
            !loginCard ||
            reduceMotion
        ) {
            return;
        }

        loginPage.addEventListener(
            "pointermove",
            function (event) {

                const mouseX =
                    event.clientX /
                    window.innerWidth - 0.5;

                const mouseY =
                    event.clientY /
                    window.innerHeight - 0.5;

                loginPage.style.setProperty(
                    "--mouse-x",
                    mouseX * 2
                );

                loginPage.style.setProperty(
                    "--mouse-y",
                    mouseY * 2
                );
            }
        );

        loginPage.addEventListener(
            "pointerleave",
            function () {

                loginPage.style.setProperty(
                    "--mouse-x",
                    0
                );

                loginPage.style.setProperty(
                    "--mouse-y",
                    0
                );
            }
        );

    });
</script>
</body>
</html>
