<!DOCTYPE html>
<html
    lang="th"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0">

    <title>
        ลืมรหัสผ่าน | KKU FoodShare
    </title>

    <link
        rel="stylesheet"
        th:href="@{/css/password-reset.css}">

</head>

<body>

<main class="reset-page">

    <!-- ของตกแต่งพื้นหลัง -->
    <div
        class="reset-atmosphere"
        aria-hidden="true">

        <span
            class="bubble bubble-one">
        </span>

        <span
            class="bubble bubble-two">
        </span>

        <span
            class="leaf leaf-one">
            ◆
        </span>

        <span
            class="leaf leaf-two">
            ◆
        </span>

    </div>

    <section class="reset-card">

        <!-- Logo -->
        <a
            th:href="@{/}"
            class="logo-link"
            aria-label="กลับหน้าหลัก">

            <img
                th:src="@{/images/foodshare-logo.png}"
                alt="KKU FoodShare"
                class="reset-logo">

        </a>

        <div
            class="reset-icon"
            aria-hidden="true">
            ✉
        </div>

        <!-- หัวข้อ -->
        <header class="reset-header">

            <h1>
                ลืมรหัสผ่าน?
            </h1>

            <p>
                ไม่เป็นไร กรอกอีเมลที่ใช้สมัครสมาชิก
                <br>
                เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้คุณ
            </p>

        </header>

        <!-- ส่งคำขอสำเร็จ -->
        <div
            class="alert alert-success"
            th:if="${param.sent}">

            <strong>
                ตรวจสอบอีเมลของคุณ
            </strong>

            <span>
                หากอีเมลนี้มีบัญชีอยู่
                เราได้ส่งลิงก์ตั้งรหัสผ่านใหม่ให้แล้ว
                ลิงก์จะหมดอายุใน 15 นาที
            </span>

        </div>

        <!-- แบบฟอร์มอีเมล -->
        <form
            th:unless="${param.sent}"
            th:action="@{/forgot-password}"
            th:object="${forgotPasswordRequest}"
            method="post"
            class="reset-form">

            <div class="form-group">

                <label for="email">
                    อีเมล
                    <span>*</span>
                </label>

                <div
                    class="input-wrapper"
                    th:classappend="
                        ${#fields.hasErrors('email')}
                        ? ' input-error'
                    ">

                    <span
                        class="input-icon"
                        aria-hidden="true">
                        ✉
                    </span>

                    <input
                        id="email"
                        type="email"
                        th:field="*{email}"
                        placeholder="example@kku.ac.th"
                        autocomplete="email"
                        required
                        autofocus>

                </div>

                <p
                    class="field-error"
                    th:if="
                        ${#fields.hasErrors('email')}
                    "
                    th:errors="*{email}">
                </p>

            </div>

            <button
                type="submit"
                class="primary-button">

                ส่งลิงก์ตั้งรหัสผ่านใหม่

                <span>→</span>

            </button>

        </form>

        <!-- กลับหน้า Login -->
        <a
            th:href="@{/login}"
            class="back-link">

            <span>←</span>

            กลับไปหน้าเข้าสู่ระบบ

        </a>

    </section>

    <footer class="reset-footer">

        <strong>
            KKU FoodShare
        </strong>

        <span>
            Share Food · Brighter Tomorrow
        </span>

    </footer>

</main>

</body>
</html>
