<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('ตั้งรหัสผ่านใหม่')}"></head>
  <body data-page="reset-password" class="auth-page">
    <header th:replace="~{fragments :: header('account')}"></header>
    <main class="container auth-layout">
      <aside class="auth-art">
        <div class="auth-art-copy">
        <span class="eyebrow">A COMMUNITY THAT CARES</span>
        <h2>มื้อเล็ก ๆ ของเรา<br /><span>ความสุขใหญ่ ๆ ของใคร</span></h2>
        <p>เริ่มต้นเรื่องราวดี ๆ ด้วยการแบ่งปัน</p>
        </div>
        <div class="auth-image-stage"><span class="auth-art-ring" aria-hidden="true"></span><img src="/images/register-mascot.webp" alt="มาสคอต FoodShare" /></div>
        <div class="auth-art-bottom">
          <svg class="icon" aria-hidden="true"><use href="#i-leaf"></use></svg>
          KKU FOODSHARE COMMUNITY
        </div>
      </aside>
      <section class="auth-form-panel">
        <span class="auth-symbol"
          ><svg class="icon" aria-hidden="true"><use href="#i-leaf"></use></svg
        ></span>
        <h1>ตั้งรหัสผ่านใหม่</h1>
        <p class="auth-subtitle">เลือกรหัสผ่านที่เดายากและคุณจดจำได้</p>
        <div th:unless="${validToken}" class="form-error">
          ลิงก์นี้หมดอายุหรือถูกใช้ไปแล้ว
          <a href="/forgot-password">ขอลิงก์ใหม่</a>
        </div>
        <form
          th:if="${validToken}"
          th:action="@{/reset-password}"
          th:object="${resetPasswordRequest}"
          method="post"
          class="auth-form"
        >
          <input type="hidden" th:field="*{token}" /><label
            >รหัสผ่านใหม่<span class="auth-input-wrap"><input
              type="password"
              th:field="*{password}"
              minlength="8"
              maxlength="72"
              required
              autocomplete="new-password" /><button type="button" class="password-toggle" data-password-toggle="password" aria-controls="password" aria-pressed="false" aria-label="แสดงรหัสผ่าน">แสดง</button></span><small
              class="field-error"
              th:errors="*{password}"
            ></small></label
          ><label
            >ยืนยันรหัสผ่าน<span class="auth-input-wrap"><input
              type="password"
              th:field="*{confirmPassword}"
              minlength="8"
              maxlength="72"
              required
              autocomplete="new-password" /><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-controls="confirmPassword" aria-pressed="false" aria-label="แสดงรหัสผ่านยืนยัน">แสดง</button></span><small
              class="field-error"
              th:errors="*{confirmPassword}"
            ></small
          ></label>
          <p class="form-error" role="alert" th:each="message : ${#fields.errors('passwordMatching')}" th:text="${message}"></p>
          <p class="form-error" role="alert" th:each="message : ${#fields.errors('passwordWithinByteLimit')}" th:text="${message}"></p>
          <p
            class="form-error"
            th:if="${#fields.hasGlobalErrors()}"
            th:each="e : ${#fields.globalErrors()}"
            th:text="${e}"
          ></p>
          <button class="btn btn-primary full" type="submit">
            บันทึกรหัสผ่านใหม่
          </button>
        </form>
      </section>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
  </body>
</html>
