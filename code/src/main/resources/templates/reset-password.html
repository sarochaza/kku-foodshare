<!DOCTYPE html>
<html
    lang="th"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0">

    <title>
        ตั้งรหัสผ่านใหม่ | KKU FoodShare
    </title>

    <link
        rel="stylesheet"
        th:href="@{/css/password-reset.css}">

</head>

<body>

<main class="reset-page">

    <!-- ของตกแต่งพื้นหลัง -->
    <div
        class="reset-atmosphere"
        aria-hidden="true">

        <span
            class="bubble bubble-one">
        </span>

        <span
            class="bubble bubble-two">
        </span>

        <span
            class="leaf leaf-one">
            ◆
        </span>

        <span
            class="leaf leaf-two">
            ◆
        </span>

    </div>

    <section class="reset-card">

        <!-- Logo -->
        <a
            th:href="@{/}"
            class="logo-link"
            aria-label="กลับหน้าหลัก">

            <img
                th:src="@{/images/foodshare-logo.png}"
                alt="KKU FoodShare"
                class="reset-logo">

        </a>

        <div
            class="reset-icon"
            aria-hidden="true">
            🔒
        </div>

        <header class="reset-header">

            <h1>
                ตั้งรหัสผ่านใหม่
            </h1>

            <p>
                สร้างรหัสผ่านใหม่ที่จำง่ายสำหรับคุณ
                <br>
                และคาดเดาได้ยากสำหรับผู้อื่น
            </p>

        </header>

        <!-- Token ใช้ไม่ได้ -->
        <div
            class="alert alert-error"
            th:if="${!validToken}">

            <strong>
                ลิงก์นี้ใช้งานไม่ได้แล้ว
            </strong>

            <span>
                ลิงก์อาจหมดอายุหรือเคยถูกใช้งาน
                กรุณาขอลิงก์ใหม่อีกครั้ง
            </span>

        </div>

        <!-- ฟอร์มตั้งรหัสผ่าน -->
        <form
            th:if="${validToken}"
            th:action="@{/reset-password}"
            th:object="${resetPasswordRequest}"
            method="post"
            class="reset-form">

            <!-- เก็บ Token ไว้ในฟอร์ม -->
            <input
                type="hidden"
                th:field="*{token}">

            <!-- Error ของ Token -->
            <div
                class="alert alert-error compact"
                th:if="${#fields.hasGlobalErrors()}"
                th:each="
                    error : ${#fields.globalErrors()}
                "
                th:text="${error}">
            </div>

            <!-- Error รหัสผ่านไม่ตรงกัน -->
            <div
                class="alert alert-error compact"
                th:if="
                    ${#fields.hasErrors(
                        'passwordMatching'
                    )}
                "
                th:errors="*{passwordMatching}">
            </div>

            <!-- รหัสผ่านใหม่ -->
            <div class="form-group">

                <label for="password">
                    รหัสผ่านใหม่
                    <span>*</span>
                </label>

                <div
                    class="input-wrapper"
                    th:classappend="
                        ${#fields.hasErrors('password')}
                        ? ' input-error'
                    ">

                    <span
                        class="input-icon"
                        aria-hidden="true">
                        🔒
                    </span>

                    <input
                        id="password"
                        type="password"
                        th:field="*{password}"
                        placeholder="อย่างน้อย 8 ตัวอักษร"
                        autocomplete="new-password"
                        required
                        minlength="8">

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="password"
                        aria-label="แสดงหรือซ่อนรหัสผ่าน">
                        👁
                    </button>

                </div>

                <p
                    class="field-error"
                    th:if="
                        ${#fields.hasErrors('password')}
                    "
                    th:errors="*{password}">
                </p>

            </div>

            <!-- ยืนยันรหัสผ่าน -->
            <div class="form-group">

                <label for="confirmPassword">
                    ยืนยันรหัสผ่านใหม่
                    <span>*</span>
                </label>

                <div
                    class="input-wrapper"
                    th:classappend="
                        ${#fields.hasErrors(
                            'confirmPassword'
                        )}
                        ? ' input-error'
                    ">

                    <span
                        class="input-icon"
                        aria-hidden="true">
                        ✓
                    </span>

                    <input
                        id="confirmPassword"
                        type="password"
                        th:field="*{confirmPassword}"
                        placeholder="กรอกรหัสผ่านอีกครั้ง"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                        aria-label="แสดงหรือซ่อนรหัสผ่าน">
                        👁
                    </button>

                </div>

                <p
                    class="field-error"
                    th:if="
                        ${#fields.hasErrors(
                            'confirmPassword'
                        )}
                    "
                    th:errors="*{confirmPassword}">
                </p>

            </div>

            <button
                type="submit"
                class="primary-button">

                บันทึกรหัสผ่านใหม่

                <span>→</span>

            </button>

        </form>

        <!-- ขอ Token ใหม่ -->
        <a
            th:if="${!validToken}"
            th:href="@{/forgot-password}"
            class="primary-button request-again">

            ขอลิงก์ใหม่

            <span>→</span>

        </a>

        <a
            th:href="@{/login}"
            class="back-link">

            <span>←</span>

            กลับไปหน้าเข้าสู่ระบบ

        </a>

    </section>

    <footer class="reset-footer">

        <strong>
            KKU FoodShare
        </strong>

        <span>
            Share Food · Brighter Tomorrow
        </span>

    </footer>

</main>

<script>

    document
        .querySelectorAll(
            ".password-toggle"
        )
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    const input =
                        document.getElementById(
                            button.dataset.target
                        );

                    input.type =
                        input.type === "password"
                            ? "text"
                            : "password";

                    button.setAttribute(
                        "aria-pressed",
                        input.type === "text"
                    );
                }
            );

        });

</script>

</body>
</html>
