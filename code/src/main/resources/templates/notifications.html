<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('การแจ้งเตือน')}"></head>
  <body data-page="notifications">
    <header th:replace="~{fragments :: header('account')}"></header>
    <main class="container page-main narrow">
      <div class="page-heading">
        <span class="section-kicker">A LITTLE UPDATE FOR YOU</span>
        <h1>การแจ้งเตือน</h1>
        <p>ติดตามการจองและเรื่องราวการแบ่งปันของคุณ</p>
      </div>
      <details class="panel notification-preferences" id="notification-preferences">
        <summary>ปรับความสนใจการแจ้งเตือน</summary>
        <p class="field-note">เลือกหมวดหรือคำ/พื้นที่ที่อยากติดตาม</p>
        <form id="notification-preference-form">
          <div class="preference-options"><label><input type="checkbox" name="categories" value="FOOD"> อาหาร</label><label><input type="checkbox" name="categories" value="DRINK"> เครื่องดื่ม</label><label><input type="checkbox" name="categories" value="SNACK"> ของว่าง</label></div>
          <label>คำค้นหาหรือพื้นที่ <input name="keywords" maxlength="300" placeholder="เช่น มข. หอสมุด Complex"></label>
          <button class="btn btn-soft" type="submit">บันทึกความสนใจ</button>
        </form>
      </details>
      <div
        id="notification-list"
        class="notification-list"
        aria-live="polite"
      ></div>
      <nav id="pagination" class="pagination"></nav>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
  </body>
</html>
