spring.application.name=kku-foodshare
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/foodshare}
spring.datasource.username=${DATABASE_USER:foodshare}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.forward-headers-strategy=framework
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.secret=${APP_SECRET:}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.map.tile-url=${MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
app.map.attribution=${MAP_ATTRIBUTION:\u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors}
springdoc.swagger-ui.csrf.enabled=true
