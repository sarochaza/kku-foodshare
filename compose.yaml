services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodshare
      POSTGRES_USER: foodshare
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/setup-env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodshare -d foodshare"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/foodshare
      DATABASE_USER: foodshare
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Database password required}
      APP_SECRET: ${APP_SECRET:?Application secret required}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      IMAGE_STORAGE_PROVIDER: ${IMAGE_STORAGE_PROVIDER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - food_images:/app/uploads
volumes:
  postgres_data:
  food_images:
